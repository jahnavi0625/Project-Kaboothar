<!DOCTYPE html>
<html>

<head>
    <title>Email Sender</title>
    <link rel="stylesheet" type="text/css" href="style-home.css">
</head>

<body>
    <div class="container">
        <h1>Email Sender - Kaboothar</h1>

        <!-- Email Data Box -->
        <div class="email-data-box">
            <h2>Email Data</h2>
            <div id="emailData"></div>
        </div>

        <!-- Send Email Box -->
        <div class="send-email-box">
            <h2>Send Email</h2>
            <form id="emailForm" enctype="multipart/form-data">
                <label for="to">To:</label><br>
                <input type="email" id="to" name="to" required><br><br>

                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required><br><br>

                <label for="body">Body:</label><br>
                <textarea id="body" name="body" rows="4" cols="50" required></textarea><br><br>

                <label for="attachment">Attachment:</label><br>
                <input type="file" id="attachment" name="attachment"><br><br>

                <button type="submit">Send Email</button>
            </form>
        </div>

        <!-- Address Book Box -->
        <div class="address-book-box">
            <h2>Address Book</h2>
            <div id="addressBook"></div>
        </div>

        <button id="fetchEmails">Fetch Emails</button>
        <button id="fetchAddressBook">Fetch Address Book</button>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);

            try {
                const response = await fetch('/send-email', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();

                if (response.ok) {
                    console.log('Email sent successfully:', result);
                } else {
                    console.error('Error sending email:', result);
                }
            } catch (error) {
                console.error('Error sending email:', error);
            }
        });

        document.getElementById('fetchEmails').addEventListener('click', async function () {
            try {
                const response = await fetch('/fetch-emails');
                const emails = await response.json();

                const emailDataDiv = document.getElementById('emailData');
                emailDataDiv.innerHTML = '';
                emails.forEach(email => {
                    const p = document.createElement('p');
                    p.textContent = email;
                    emailDataDiv.appendChild(p);
                });
            } catch (error) {
                console.error('Error fetching emails:', error);
            }
        });

        document.getElementById('fetchAddressBook').addEventListener('click', async function () {
            try {
                const response = await fetch('/fetch-address-book');
                const contacts = await response.json();

                const addressBookDiv = document.getElementById('addressBook');
                addressBookDiv.innerHTML = '';
                contacts.forEach(contact => {
                    const p = document.createElement('p');
                    p.textContent = `${contact.name} - ${contact.email}`;
                    addressBookDiv.appendChild(p);
                });
            } catch (error) {
                console.error('Error fetching address book:', error);
            }
        });
    </script>
</body>

</html>
