<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaboothar - Email Sender</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Kaboothar Email Sender</h1>
        <form id="emailForm" enctype="multipart/form-data">
            <label for="to">To:</label>
            <input type="email" id="to" name="to" placeholder="Recipient's email" required>

            <label for="cc">CC:</label>
            <input type="email" id="cc" name="cc" placeholder="CC (optional)">

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Email subject" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

            <label for="attachments">Attachments:</label>
            <input type="file" id="attachments" name="attachments">

            <button type="submit">Send Email</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);

            try {
                const response = await fetch('/send-email', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('status').textContent = 'Email sent successfully!';
                } else {
                    document.getElementById('status').textContent = `Error sending email: ${result.message}`;
                }
            } catch (error) {
                document.getElementById('status').textContent = `Error sending email: ${error.message}`;
            }
        });
    </script>
</body>

</html>
