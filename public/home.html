<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home - Email Dashboard</title>
  <link rel="stylesheet" href="style-home.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initializeDashboard()">

  <!-- Header Navigation (only switches sections) -->
  <header class="nav-header">
    <button onclick="openSection('received')" id="receivedBtn">
      Received Mails <span id="receivedBadge" class="badge" style="display:none;">0</span>
    </button>    
    <button onclick="openSection('sent')">Sent Mails</button>
    <button onclick="openSection('compose')">Compose</button>
    <button onclick="openSection('addContact')">Add Contact</button>
    <button onclick="openSection('addressBook')">Address Book</button>
  </header>

  <!-- Sections -->
  <div id="received" class="section">
    <h3>Received Emails</h3>
    <ul id="receivedEmails"></ul>
  </div>

  <div id="sent" class="section">
    <h3>Sent Emails</h3>
    <ul id="sentEmails"></ul>
  </div>

  <div id="compose" class="section">
    <h3>Send Email</h3>
    <form id="sendEmailForm" enctype="multipart/form-data">
      <label for="to">To (comma-separated):</label>
      <input type="text" id="to" name="to" required />

      <label for="cc">CC (comma-separated):</label>
      <input type="text" id="cc" name="cc" />

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea>

      <label for="attachment">Attachments:</label>
      <input type="file" name="attachments" id="attachment" multiple />

      <button type="submit">Send</button>
      <p id="status"></p>
    </form>
  </div>

  <div id="addContact" class="section">
    <h3>Add Contact</h3>
    <form id="addContactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="contactEmail" name="email" required />

      <button type="submit">Add Contact</button>
      <p id="contactStatus"></p>
    </form>
  </div>

  <div id="addressBook" class="section">
    <h3>Address Book</h3>
    <ul id="addressBook"></ul>
  </div>

  <script>
    function openSection(id) {
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      if (id === 'received') fetchReceived();
      if (id === 'sent') fetchEmails();
      if (id === 'addressBook') fetchAddressBook();
    }

    function initializeDashboard() {
      openSection('received');
    }
  </script>
  <script src="main.js"></script>
</body>
</html>
